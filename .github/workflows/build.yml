name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      # every page rendered with sample data (see TemplateRenderingTest), to review the design
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-previews
          path: |
            target/preview/
            src/main/resources/static/
          if-no-files-found: ignore
      # same image Render builds
      - run: docker build -t spring-supabase-auth-demo .
