<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Authorize application')}">
    <meta charset="UTF-8">
    <title>Authorize application</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;800&display=swap">
    <link rel="stylesheet" href="../static/css/app.css">
</head>
<!-- Public values only: the project URL and the publishable key -->
<body class="consent-page" th:data-supabase-url="${supabase.url}" th:data-supabase-key="${supabase.publishableKey}">
<main class="consent">

    <p class="consent-host">Supabase sign-in, hosted by this Spring app</p>
    <h1 id="title">Sign in to continue</h1>

    <p id="status" class="muted" role="status">Loading…</p>

<!-- Step 1: sign in to Supabase -->
    <section id="sign-in" class="sheet" hidden>
        <form id="password-form" class="form">
            <label>Email <input id="email" type="email" autocomplete="email" required></label>
            <label>Password <input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
            <button type="submit" class="button wide">Sign in</button>
            <p class="muted small">New here? <button type="button" id="sign-up" class="link-button">Create an account</button> with this email and password.</p>
        </form>
        <div class="divider"><span>or</span></div>
        <div class="stack">
            <button type="button" id="magic-link" class="button quiet wide">Email me a sign-in link</button>
            <button type="button" id="github" class="button quiet wide">Continue with GitHub</button>
        </div>
        <p id="sign-in-error" class="form-message" role="alert" hidden></p>
    </section>

    <!-- Step 2: approve or deny -->
    <section id="consent" class="sheet" hidden>
        <p class="consent-who">Signed in as <strong id="user-email"></strong>.
            <button type="button" id="switch-account" class="link-button">Use another account</button></p>
        <h2 class="consent-ask"><span id="client-name">An application</span> will be able to:</h2>
        <ul id="scopes" class="permissions"></ul>
        <div class="decide">
            <button type="button" id="approve" class="button wide">Allow</button>
            <button type="button" id="deny" class="button quiet wide">Cancel</button>
        </div>
        <p class="muted small">After you allow, you'll go back to <code id="redirect-uri"></code></p>
    </section>

</main>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const { supabaseUrl, supabaseKey } = document.body.dataset;
    const supabase = createClient(supabaseUrl, supabaseKey);
    const authorizationId = new URLSearchParams(location.search).get('authorization_id');
    // social / magic-link sign-ins come back to this exact URL, authorization_id included
    const returnTo = location.origin + location.pathname + location.search;

    const $ = (id) => document.getElementById(id);
    const show = (id) => { for (const s of ['status', 'sign-in', 'consent']) $(s).hidden = s !== id; };
    // what each scope lets the app do, in plain words
    const PERMISSIONS = {
        openid: 'Confirm who you are',
        email: 'See your email address',
        profile: 'See your name and profile picture',
        phone: 'See your phone number',
        offline_access: 'Stay signed in when you\'re away',
    };
    const status = (text) => { $('status').textContent = text; show('status'); };
    const signInError = (text) => { $('sign-in-error').textContent = text; $('sign-in-error').hidden = !text; };

    async function start() {
        if (!authorizationId) {
            status('Missing authorization_id. Start from the app\'s "Sign in with Supabase" button.');
            return;
        }
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            show('sign-in');
            return;
        }
        await loadConsent(user);
    }

    async function loadConsent(user) {
        status('Loading the authorization request…');
        const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
        if (error) {
            status('Could not load the request: ' + error.message);
            return;
        }
        // no authorization_id in the response: the user already consented, Supabase gives the redirect directly
        if (!('authorization_id' in data) && data.redirect_url) {
            status('Already approved, redirecting…');
            location.href = data.redirect_url;
            return;
        }
        $('title').textContent = 'Allow ' + (data.client?.name ?? 'this application') + '?';
        $('client-name').textContent = data.client?.name ?? 'An application';
        $('user-email').textContent = user.email ?? user.id;
        $('redirect-uri').textContent = data.redirect_uri ?? '';
        $('scopes').replaceChildren(...(data.scope ?? '').trim().split(/\s+/).filter(Boolean).map((scope) => {
            const li = document.createElement('li');
            li.textContent = PERMISSIONS[scope] ?? scope;
            li.title = scope;
            return li;
        }));
        show('consent');
    }

    async function decide(approve) {
        status(approve ? 'Approving…' : 'Denying…');
        const { data, error } = approve
            ? await supabase.auth.oauth.approveAuthorization(authorizationId)
            : await supabase.auth.oauth.denyAuthorization(authorizationId);
        if (error) {
            status('Error: ' + error.message);
            return;
        }
        location.href = data.redirect_url;
    }

    $('password-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        signInError('');
        const { data, error } = await supabase.auth.signInWithPassword({
            email: $('email').value, password: $('password').value,
        });
        if (error) return signInError(error.message);
        await loadConsent(data.user);
    });

    $('sign-up').addEventListener('click', async () => {
        signInError('');
        if (!$('password-form').reportValidity()) return;
        const { data, error } = await supabase.auth.signUp({
            email: $('email').value, password: $('password').value,
            options: { emailRedirectTo: returnTo },
        });
        if (error) return signInError(error.message);
        if (!data.session) return signInError('Check your inbox to confirm your email, then come back with the link.');
        await loadConsent(data.user);
    });

    $('magic-link').addEventListener('click', async () => {
        signInError('');
        if (!$('email').reportValidity()) return;
        const { error } = await supabase.auth.signInWithOtp({
            email: $('email').value, options: { emailRedirectTo: returnTo },
        });
        signInError(error ? error.message : 'Sign-in link sent. Open it in this browser.');
    });

    $('github').addEventListener('click', async () => {
        signInError('');
        const { error } = await supabase.auth.signInWithOAuth({
            provider: 'github', options: { redirectTo: returnTo },
        });
        if (error) signInError(error.message);
    });

    $('approve').addEventListener('click', () => decide(true));
    $('deny').addEventListener('click', () => decide(false));
    $('switch-account').addEventListener('click', async () => {
        await supabase.auth.signOut();
        $('title').textContent = 'Sign in to continue';
        show('sign-in');
    });

    start().catch((e) => status('Unexpected error: ' + e.message));
</script>
</body>
</html>
