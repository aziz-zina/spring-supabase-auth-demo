<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Signed out')}">
    <meta charset="UTF-8">
    <title>Signed out | Token inspector</title>
    <link rel="stylesheet" href="../static/css/app.css">
</head>
<body th:data-supabase-url="${supabase.url}" th:data-supabase-key="${supabase.publishableKey}">
<main class="auth">
    <div class="card">
        <span class="logo" aria-hidden="true">S</span>
        <h1>Signed out</h1>
        <p id="status" role="status">Closing your Supabase session…</p>
        <a class="btn primary lg block" href="/" th:href="@{/}">Sign in again</a>
    </div>
</main>
<script type="module">
    // Spring's session is gone; this also clears the Supabase session kept by supabase-js in this browser,
    // so the next sign-in asks for credentials again (handy to test another user).
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const { supabaseUrl, supabaseKey } = document.body.dataset;
    const { error } = await createClient(supabaseUrl, supabaseKey).auth.signOut();
    document.getElementById('status').textContent = error
        ? 'Signed out of this app. Your Supabase session is still open: ' + error.message
        : 'Signed out of this app and of Supabase. The next sign-in will ask for your password.';
</script>
</body>
</html>
